<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobility — splash</title>
<style>
  html, body { margin: 0; height: 100%; background: #2D2D2D; overflow: hidden; }
  .frame { position: fixed; inset: 0; overflow: hidden; }
  .stage { position: absolute; left: 0; top: 0; width: 540px; height: 1170px; transform-origin: 0 0; }
  .skew { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .lane { position: absolute; width: 33px; will-change: transform; background-repeat: repeat-y; }
  .piece { position: absolute; background: #F7D049; }
  .m { position: absolute; left: 81px; top: 0; width: 108px; height: 90px; will-change: transform, opacity; }
  .will { will-change: transform, opacity; }
</style>
</head>
<body>
<div class="frame"><div class="stage" id="stage"></div></div>
<script>
(function () {
  const LINE = '#8C7A3C', STROKE = 2.2;
  const DW = 540, DH = 1170, CX = DW / 2, CY = DH / 2;
  const K = 1.9, PX = 36, PY = 72, PW = 27, PH = 54;
  const SKEW = 'skewX(-26.5651deg)';
  const T_STOP = 1.5, T_FILL = 1.75, T_GROW = 2.05, T_HOLD = 2.75, T_END = 4.4;
  const EASE_OUT = 'cubic-bezier(0.33, 1, 0.68, 1)';
  const EASE_IN_OUT = 'cubic-bezier(0.65, 0, 0.35, 1)';

  const GRID = { s: K, tx: CX - K * 9, ty: CY - K * 45 };
  const BIG = { s: 2.6, tx: CX - 2.6 * 9, ty: CY - 2.6 * 45 };
  const FIN = { s: 1.25, tx: CX - 1.25 * 72, ty: CY - 1.25 * 45 };
  const place = m => `translate(${m.tx}px, ${m.ty}px) scale(${m.s}) ${SKEW}`;

  const inv = (X, Y) => { const y = (Y - GRID.ty) / GRID.s; return [(X - GRID.tx) / GRID.s + 0.5 * y, y]; };
  const cs = [[0, 0], [DW, 0], [0, DH], [DW, DH]].map(p => inv(p[0], p[1]));
  const minX = Math.min(...cs.map(c => c[0])) - PX * 2, maxX = Math.max(...cs.map(c => c[0])) + PX * 2;
  const Y0 = Math.min(...cs.map(c => c[1])) - PY * 2, Y1 = Math.max(...cs.map(c => c[1])) + PY * 2;
  const c0 = Math.floor(minX / PX), c1 = Math.ceil(maxX / PX);

  const tile = `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='33' height='72'><rect x='3' y='0' width='${PW}' height='${PH}' fill='none' stroke='${LINE}' stroke-width='${STROKE / K}'/></svg>`)}")`;

  const stage = document.getElementById('stage');
  const el = (cls, parent, style = {}) => {
    const e = document.createElement('div');
    e.className = cls;
    Object.assign(e.style, style);
    parent.appendChild(e);
    return e;
  };
  const anims = [];
  const animate = (e, frames, opts) => anims.push(e.animate(frames, { fill: 'both', ...opts }));

  const pattern = el('skew will', stage, { transform: place(GRID) });
  for (let c = c0; c <= c1; c++) {
    const rows = 3 + Math.round((c - c0) * 0.5);
    const yoff = Math.abs(c) % 2 ? 36 : 0;
    const height = Y1 - Y0 + rows * PY;
    const lane = el('lane', pattern, {
      left: `${c * PX - 3}px`, top: `${Y0}px`, height: `${height}px`,
      backgroundImage: tile, backgroundPosition: `0 ${(((yoff - Y0) % PY) + PY) % PY}px`,
    });
    animate(lane, [{ transform: `translateY(${-rows * PY}px)` }, { transform: 'translateY(0)' }],
      { duration: T_STOP * 1000, easing: EASE_OUT });
  }
  animate(pattern, [{ opacity: 1 }, { opacity: 0 }],
    { delay: T_FILL * 1000, duration: (T_GROW + 0.25 - T_FILL) * 1000 });

  const bolt = el('skew will', stage, { transform: place(GRID) });
  el('piece', bolt, { left: '0px', top: '0px', width: `${PW}px`, height: `${PH}px` });
  el('piece', bolt, { left: '36px', top: '36px', width: `${PW}px`, height: `${PH}px` });
  animate(bolt, [{ opacity: 0 }, { opacity: 1 }],
    { delay: T_STOP * 1000, duration: (T_FILL + 0.3 - T_STOP) * 1000 });
  const total = T_HOLD + 0.55;
  animate(bolt, [
    { offset: 0, transform: place(GRID) },
    { offset: T_GROW / total, transform: place(GRID), easing: EASE_IN_OUT },
    { offset: (T_GROW + 0.55) / total, transform: place(BIG) },
    { offset: T_HOLD / total, transform: place(BIG), easing: EASE_IN_OUT },
    { offset: 1, transform: place(FIN) },
  ], { duration: total * 1000 });

  const mWrap = el('skew', stage, { transform: place(FIN) });
  const m = el('m', mWrap);
  m.innerHTML = `<svg width="108" height="90" viewBox="81 0 108 90"><polygon fill="#FFFFFF" points="81,0 108,0 130.5,27 139.5,27 162,0 189,0 189,90 162,90 162,36 139.5,63 130.5,63 108,36 108,90 81,90"/></svg>`;
  const mStart = (T_HOLD + 0.22) * 1000;
  animate(m, [{ transform: 'translateY(-112px)' }, { transform: 'translateY(0)' }],
    { delay: mStart, duration: 550, easing: EASE_OUT });
  animate(m, [{ opacity: 0 }, { opacity: 1 }], { delay: mStart, duration: 250 });

  function fit() {
    const w = innerWidth;
    const h = innerHeight >= innerWidth ? Math.max(innerHeight, screen.height) : innerHeight;
    const s = Math.max(w / DW, h / DH);
    stage.style.transform = `translate(${(w - DW * s) / 2}px, ${(h - DH * s) / 2}px) scale(${s})`;
  }
  fit();
  addEventListener('resize', fit);

  window.renderAt = t => anims.forEach(a => { a.pause(); a.currentTime = t * 1000; });
  window.SPLASH_DURATION = T_END;

  if (/capture/.test(location.hash)) { window.renderAt(0); return; }
  setTimeout(() => dispatchEvent(new Event('splashend')), T_END * 1000);
})();
</script>
</body>
</html>
